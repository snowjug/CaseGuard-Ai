# gitleaks configuration used by CI (gitleaks/gitleaks-action) and for local runs:
#   gitleaks detect --source . --config .gitleaks.toml --redact
#
# This file only SUPPRESSES known-safe content on top of the built-in rules. The repository also has
# its own scanner (scripts/scan-secrets.mjs, run by the pre-commit hook and `pnpm secrets:scan`);
# the two are independent layers and neither relaxes the other.
title = "CaseGuard AI gitleaks configuration"

[extend]
# Keep every built-in rule.
useDefault = true

[[allowlists]]
description = "Synthetic demo data intentionally contains generated, secret-shaped canary strings used to test redaction (FR-ING-04). None of them is a real credential."
paths = ['''(^|/)synthetic-data/''']

[[allowlists]]
description = "pnpm lockfile integrity hashes are public content digests, not credentials."
paths = ['''(^|/)pnpm-lock\.yaml$''']

[[allowlists]]
description = "Azure built-in role definition ids (and other GUID constants) in Bicep templates are public identifiers, not credentials; only a value that is exactly a GUID is allowed."
condition = "AND"
paths = ['''(^|/)infra/.*\.bicep$''']
regexTarget = "secret"
regexes = ['''^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$''']

[[allowlists]]
description = "Documentation, issue/PR templates and env templates: lines that are clearly placeholders (angle-bracket values, example/changeme/placeholder markers, repeated x, all-zero GUIDs)."
condition = "AND"
paths = ['''(^|/)(docs/.*|[^/]*)\.md$''', '''(^|/)\.env\.example$''', '''(^|/)\.github/.*\.(md|ya?ml)$''']
regexTarget = "line"
regexes = ['''(?i)(<[a-z0-9_ .-]+>|changeme|placeholder|example|your[-_ ]|x{6,}|0{8}-0{4}-0{4}-0{4}-0{12})''']

[[allowlists]]
description = "e2e/security-http.spec.ts sends a fixed, made-up Idempotency-Key header (a label that starts with 'e2e-idempotency-key-') to a local echo stub to check that the proxy forwards it unchanged. It is a deterministic test constant and an idempotency key is not a credential, but generic-api-key flags it because the header name contains 'key'. Only that header literal, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^e2e/security-http\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*'idempotency-key':\s*'e2e-idempotency-key-[0-9]{4}',?\s*$''']

# The entries below cover findings that a scan of the whole history reports in older commits (the CI scan only reads
# the commits of a push or pull request, so it does not show them). Each is a fixed test constant: one file, one rule
# and the one line shape that holds it.

[[allowlists]]
description = "apps/api/test/migrate-cli.int.test.ts sets a made-up password marker (a label that starts with 'p4ssw0rd-marker-') to check that the migrate command never prints it. It is a test constant, not a credential. Only that assignment, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/api/test/migrate-cli\.int\.test\.ts$''']
regexTarget = "line"
# secretscan:allow-next-line a regex that matches a made-up password marker in one test, not a credential
regexes = ['''^\s*const password = 'p4ssw0rd-marker-[0-9]{2}';\s*$''']

[[allowlists]]
description = "apps/api/test/skills.int.test.ts uses fixed, made-up idempotency keys (labels that start with 'idem-skill-') to repeat a request. An idempotency key is not a credential, but generic-api-key flags the variable name. Only that assignment, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/api/test/skills\.int\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const key = 'idem-skill-[a-z]+-[0-9]{4}';\s*$''']

[[allowlists]]
description = "packages/ai/test/prompts.test.ts pins the SHA-256 digest of each published prompt template. A content digest is public and not a credential, but generic-api-key flags the 'token_governor' name. Only that one pin line, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^packages/ai/test/prompts\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*token_governor:\s*'[0-9a-f]{64}',?\s*$''']

[[allowlists]]
description = "packages/ai/test/azure-openai.int.test.ts uses an obviously fake API key (a label that starts with 'sk-test-SECRET-KEY-') to check that the provider never echoes it. It is a test constant, not a credential. Only that assignment, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^packages/ai/test/azure-openai\.int\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const API_KEY = 'sk-test-SECRET-KEY-[0-9a-f]+';\s*$''']

[[allowlists]]
description = "packages/security/test/redaction-property.test.ts builds PEM-shaped private-key blocks from generated bodies to check that redaction removes them. The line is a template with a body placeholder, not a key. Only that template, in that one file, for that one rule is allowed."
condition = "AND"
targetRules = ["private-key"]
paths = ['''^packages/security/test/redaction-property\.test\.ts$''']
regexTarget = "line"
# secretscan:allow-next-line a regex that matches a PEM-shaped template with a body placeholder, not a key
regexes = ['''-----BEGIN PRIVATE KEY-----\\n\$\{body\}\\n-----END PRIVATE KEY-----''']

[[allowlists]]
description = "packages/ai/test/reasoning/locate.test.ts and the rules instruction-like-text.test.ts and secret-like-text.test.ts use the made-up value 'abcdef1234567890' in an API key assignment to check that the reasoning rules recognise or ignore secret-like text. It is a test constant, not a credential. Only that value, in those three files, for that one rule is allowed."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^packages/ai/test/reasoning/(locate|rules/instruction-like-text|rules/secret-like-text)\.test\.ts$''']
regexTarget = "line"
regexes = ['''abcdef1234567890''']
